{% extends "base.html" %}

{% block title %}Solicitar homologacion{% endblock %}

{% block content %}
<p><a href="{% url 'homologaciones:homologacion_list' %}">Volver a homologaciones</a></p>

<h1>Solicitar homologacion</h1>

<form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
        <div class="mb-3">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        </div>
    {% endfor %}
    <button class="btn btn-primary" type="submit">Crear solicitud</button>
</form>
{% endblock %}
